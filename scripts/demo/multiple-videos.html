<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Múltiplos vídeos — demonstração</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <nav class="back"><a href="index.html">← Voltar ao índice</a></nav>
  <h1>Três vídeos, três contextos</h1>
  <p>
    A mesma página mostra três vídeos com textos ao redor bem diferentes,
    para comparar como cada um é classificado.
  </p>

  <figure>
    <p class="figure-label"><strong>1. Contexto neutro</strong></p>
    <video controls width="360" crossorigin="anonymous">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
      Seu navegador não suporta reprodução de vídeo HTML5.
    </video>
    <figcaption>Passeio pela praia ao entardecer, com direito a pôr do sol e água morna.</figcaption>
  </figure>

  <figure>
    <p class="figure-label"><strong>2. Hashtag de IA no texto visível</strong></p>
    <video controls width="360" crossorigin="anonymous">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
      Seu navegador não suporta reprodução de vídeo HTML5.
    </video>
    <figcaption>Paisagem experimental gerada para testes visuais. #ai #sora</figcaption>
  </figure>

  <figure>
    <p class="figure-label"><strong>3. Contexto de risco (golpe)</strong></p>
    <video controls width="360" crossorigin="anonymous">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
      Seu navegador não suporta reprodução de vídeo HTML5.
    </video>
    <figcaption>Você tem direito a uma indenização, faça um Pix de confirmação agora para liberar o valor.</figcaption>
  </figure>
</body>
</html>
